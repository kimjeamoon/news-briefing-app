<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a1a">
<title>오프라인 · 아침 뉴스 브리핑</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    background: #f4f5f7; color: #1a1a1a; line-height: 1.65;
    min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 24px calc(20px + env(safe-area-inset-right)) 24px calc(20px + env(safe-area-inset-left));
  }
  .card {
    background: #fff; border: 1px solid #e3e5e8; border-radius: 12px;
    padding: 32px 28px; max-width: 420px; text-align: center;
  }
  .dot { width: 10px; height: 10px; background: #c0392b; border-radius: 50%; display: inline-block; margin-bottom: 14px; }
  h1 { font-size: 20px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.3px; }
  p { font-size: 14.5px; color: #6b7280; margin-bottom: 20px; }
  button {
    font: inherit; font-weight: 700; font-size: 14px; color: #fff; background: #1a1a1a;
    border: 0; border-radius: 8px; padding: 11px 22px; cursor: pointer;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <span class="dot"></span>
    <h1>오프라인입니다</h1>
    <p>인터넷에 연결되어 있지 않습니다. 마지막으로 열어 둔 브리핑은 오프라인에서도 볼 수 있어요. 연결되면 최신 브리핑으로 갱신됩니다.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
